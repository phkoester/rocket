# ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, Release)
    runs-on: ubuntu-latest
    # Ubuntu 26.04 ships GCC 15, CMake 4.2, and ICU 78, which the hosted runner images do not
    container: ubuntu:26.04
    timeout-minutes: 120

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DEBIAN_FRONTEND: noninteractive
      GAIA_DIR: ${{ github.workspace }}/gaia
      LANG: C.UTF-8

    defaults:
      run:
        working-directory: rocket

    steps:
      # Git must be installed before checkout, otherwise `actions/checkout` downloads a tarball without
      # `.git`
      - name: Install packages
        working-directory: .
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates ccache cmake g++ git libgtk-3-dev libicu-dev libwebkit2gtk-4.1-dev ninja-build \
            python3 tzdata

      - name: Check out
        uses: actions/checkout@v7
        with:
          path: rocket

      # Rocket uses `GAIA_DIR` as Gaia’s source instead of fetching the tag `v${ROCKET_GAIA_VERSION}`
      - name: Check out Gaia
        uses: actions/checkout@v7
        with:
          repository: phkoester/gaia
          ref: main
          path: gaia

      # The container runs as root, but the workspace belongs to the runner user
      - name: Mark the workspace safe for Git
        run: git config --global --add safe.directory '*'

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-release-${{ github.sha }}
          restore-keys: ccache-linux-release-

      - name: Configure
        run: cmake --preset multi -DROCKET_BUILD_BENCH=ON -DROCKET_BUILD_TEST=ON

      - name: Build
        run: cmake --build --preset multi-Release

      - name: Test
        run: ctest --preset multi-Release --test-dir build --output-on-failure --parallel "$(nproc)"

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  macos:
    name: macOS (LLVM, Release)
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      GAIA_DIR: ${{ github.workspace }}/gaia

    defaults:
      run:
        working-directory: rocket

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: rocket

      # Rocket uses `GAIA_DIR` as Gaia’s source instead of fetching the tag `v${ROCKET_GAIA_VERSION}`
      - name: Check out Gaia
        uses: actions/checkout@v7
        with:
          repository: phkoester/gaia
          ref: main
          path: gaia

      # Installing an outdated formula upgrades it, so this also makes sure CMake is 4.2 or higher. Rocket
      # finds the keg-only `icu4c` through `brew --prefix icu4c`
      - name: Install packages
        run: brew install ccache cmake icu4c ninja

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-macos-release-${{ github.sha }}
          restore-keys: ccache-macos-release-

      - name: Configure
        run: cmake --preset multi -DROCKET_BUILD_BENCH=ON -DROCKET_BUILD_TEST=ON

      - name: Build
        run: cmake --build --preset multi-Release

      - name: Test
        run: ctest --preset multi-Release --test-dir build --output-on-failure --parallel "$(sysctl -n hw.ncpu)"

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      CC: cl
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CXX: cl
      GAIA_DIR: ${{ github.workspace }}/gaia

    # PowerShell rather than Git Bash, whose `link.exe` would hide MSVC’s linker
    defaults:
      run:
        shell: pwsh
        working-directory: rocket

    steps:
      # Keep the sources byte for byte as committed
      - name: Disable line-ending conversion
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v7
        with:
          path: rocket

      # Rocket uses `GAIA_DIR` as Gaia’s source instead of fetching the tag `v${ROCKET_GAIA_VERSION}`
      - name: Check out Gaia
        uses: actions/checkout@v7
        with:
          repository: phkoester/gaia
          ref: main
          path: gaia

      # Chocolatey is preinstalled on the hosted runner. Its shim directory is already on `PATH`, which the
      # next step exports along with the MSVC environment
      - name: Install packages
        run: |
          python -m pip install --upgrade cmake ninja
          choco install ccache --yes --no-progress

      # The equivalent of a Developer Command Prompt: run `vcvars64.bat` and export its environment to the
      # following steps
      - name: Set up MSVC
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_DIR=%%i"
          call "%VS_DIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set >> "%GITHUB_ENV%"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-windows-release-${{ github.sha }}
          restore-keys: ccache-windows-release-

      # Rocket uses the ICU that comes with Windows through `<icu.h>` from the Windows SDK
      - name: Configure
        run: cmake --preset multi -DROCKET_BUILD_BENCH=ON -DROCKET_BUILD_TEST=ON

      - name: Build
        run: cmake --build --preset multi-Release

      - name: Test
        run: ctest --preset multi-Release --test-dir build --output-on-failure --parallel $env:NUMBER_OF_PROCESSORS

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

# EOF
